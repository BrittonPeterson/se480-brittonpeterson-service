[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

# Lab 4: static analysis. The default rule set (E4, E7, E9, F) is the one that
# finds bugs: undefined names, unused imports, bare except.
[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["client/generated"]

# Lab 4: the coverage map. `pytest --cov=app` reads this; the floor fails the
# run (and CI) when the service's covered lines drop below it. Lower it one
# step with a README line saying why; never remove it.
[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
show_missing = true
fail_under = 85
